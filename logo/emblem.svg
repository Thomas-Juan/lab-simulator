<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Lab Simulator emblem</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3db3ae"/>
      <stop offset="1" stop-color="#1c6f73"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe8dc"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9cfbf"/>
      <stop offset="1" stop-color="#b9ad9b"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9efee" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#c9d4d3" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="pipC" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff9a7e"/><stop offset="1" stop-color="#c24e2f"/>
    </radialGradient>
    <radialGradient id="pipY" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe7a0"/><stop offset="1" stop-color="#d9a92e"/>
    </radialGradient>
    <radialGradient id="pipL" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#e2d6f2"/><stop offset="1" stop-color="#6e5a9e"/>
    </radialGradient>
    <radialGradient id="pipG" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a8e6a0"/><stop offset="1" stop-color="#3d8f46"/>
    </radialGradient>
    <radialGradient id="drop" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#9ee7e2"/><stop offset="1" stop-color="#1c6f73"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" stroke="#1f1b33" stroke-width="14"/>
  <rect x="44" y="40" width="424" height="150" rx="80" fill="#ffffff" opacity="0.10"/>

  <!-- shadow under the die -->
  <ellipse cx="262" cy="430" rx="150" ry="22" fill="#0e2f33" opacity="0.45" filter="url(#soft)"/>

  <!-- the die, tilted: side faces then the top face -->
  <g transform="rotate(-9 256 300)">
    <path d="M118 196 L382 196 L420 232 L420 452 Q420 470 402 470 L156 470 L118 434 Z" fill="url(#side)" stroke="#1f1b33" stroke-width="12" stroke-linejoin="round"/>
    <rect x="96" y="174" width="300" height="276" rx="54" fill="url(#face)" stroke="#1f1b33" stroke-width="12"/>
    <!-- five pips: four lab colours, the centre one is the droplet -->
    <circle cx="170" cy="246" r="30" fill="url(#pipC)" stroke="#1f1b33" stroke-width="7"/>
    <circle cx="322" cy="246" r="30" fill="url(#pipY)" stroke="#1f1b33" stroke-width="7"/>
    <circle cx="170" cy="380" r="30" fill="url(#pipL)" stroke="#1f1b33" stroke-width="7"/>
    <circle cx="322" cy="380" r="30" fill="url(#pipG)" stroke="#1f1b33" stroke-width="7"/>
    <circle cx="246" cy="313" r="32" fill="url(#drop)" stroke="#1f1b33" stroke-width="7"/>
    <circle cx="160" cy="236" r="9" fill="#ffffff" opacity="0.7"/>
    <circle cx="312" cy="236" r="9" fill="#ffffff" opacity="0.7"/>
    <circle cx="160" cy="370" r="9" fill="#ffffff" opacity="0.7"/>
    <circle cx="312" cy="370" r="9" fill="#ffffff" opacity="0.7"/>
    <circle cx="235" cy="302" r="10" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- pipette tip and the falling drop -->
  <path d="M228 40 L284 40 L264 186 Q256 200 248 186 Z" fill="url(#tip)" stroke="#1f1b33" stroke-width="10" stroke-linejoin="round"/>
  <path d="M244 132 L268 132 L263 172 Q256 184 249 172 Z" fill="#2a9d99"/>
  <line x1="240" y1="58" x2="248" y2="160" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <rect x="218" y="22" width="76" height="26" rx="8" fill="#e8ecee" stroke="#1f1b33" stroke-width="10"/>
  <path d="M256 206 C246 222 242 230 242 238 A14 14 0 0 0 270 238 C270 230 266 222 256 206 Z" fill="url(#drop)" stroke="#1f1b33" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="251" cy="236" r="4" fill="#ffffff" opacity="0.8"/>
</svg>
